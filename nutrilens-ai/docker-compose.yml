version: '3.8'

services:
  nutrilens-db:
    image: postgres:15-alpine
    container_name: nutrilens_db
    restart: always
    environment:
      POSTGRES_DB: nutrilens_db
      POSTGRES_USER: nutrilens
      POSTGRES_PASSWORD: nutrilens_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nutrilens-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nutrilens_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your_gemini_api_key_here}
      - GEMINI_MODEL=gemini-1.5-flash
      - DATABASE_URL=postgresql+asyncpg://nutrilens:nutrilens_password@nutrilens-db:5432/nutrilens_db
      - CHROMA_PERSIST_DIR=/app/backend/chroma_db
      - CHROMA_COLLECTION_NAME=nutrilens_knowledge
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
    depends_on:
      - nutrilens-db

volumes:
  postgres_data:
