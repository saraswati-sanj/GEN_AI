# Render Infrastructure-as-Code Blueprint for NutriLens AI
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: nutrilens-ai
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: SECRET_KEY
        generateValue: true
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: CHROMA_PERSIST_DIR
        value: ./chroma_db
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./nutrilens.db
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
